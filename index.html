<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UERÉ · Render</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#0c0c0e; --panel:#17171b; --fg:#ebebee; --dim:#8c8c94; --acc:#ff1e2d; --ok:#78c88c; --track:#28282e; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; padding:28px 20px 40px; }
main { max-width:1180px; margin:0 auto; }
header { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; margin-bottom:22px; }
h1 { font-size:22px; font-weight:600; letter-spacing:.06em; }
.when { color:var(--dim); font-size:13px; }
.live { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--dim); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
.dot.on { background:var(--acc); animation:pulse 1.2s infinite; }
.dot.ok { background:var(--ok); }
@keyframes pulse { 50% { opacity:.3 } }
.grid { display:grid; grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); gap:22px; }
@media (max-width: 860px) { .grid { grid-template-columns:1fr; } }
.frame { background:#000; aspect-ratio:16/9; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; }
.frame img { width:100%; height:100%; object-fit:contain; display:block; }
.cap { color:var(--dim); font-size:12px; margin-top:8px; word-break:break-all; }
.panel { background:var(--panel); border-radius:6px; padding:18px 18px 8px; }
.total { font-size:30px; font-weight:600; }
.now { color:var(--dim); font-size:13px; margin:2px 0 16px; }
.sec { color:var(--acc); font-size:12px; font-weight:600; letter-spacing:.08em; margin:14px 0 8px; }
.row { margin-bottom:12px; }
.row .t { display:flex; justify-content:space-between; gap:10px; font-size:14px; }
.row .t span:last-child { color:var(--dim); font-variant-numeric:tabular-nums; }
.bar { height:6px; background:var(--track); border-radius:3px; margin-top:5px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .6s; }
.bar i.ok { background:var(--ok); }
footer { color:var(--dim); font-size:12px; margin-top:22px; }
.dl { display:block; margin:6px 0 14px; padding:12px 14px; border-radius:6px; background:var(--ok); color:#0c0c0e; font-weight:600; text-align:center; text-decoration:none; }
.dl:hover { filter:brightness(1.08); }
</style>
</head>
<body>
<main>
  <header>
    <h1>UERÉ · TELÃO · RENDER</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="state">carregando…</span></span>
    <span class="when" id="when"></span>
  </header>
  <div class="grid">
    <section>
      <div class="frame" id="frame">aguardando o primeiro frame…</div>
      <div class="cap" id="cap"></div>
    </section>
    <section class="panel">
      <div class="total" id="total">–</div>
      <div class="now" id="now"></div>
      <div id="rows"></div>
    </section>
  </div>
  <footer>Página só de visualização. Atualiza sozinha a cada minuto.</footer>
</main>
<script>
var REPO = "nottifelipe-oss/uere-render";
var URL_STATUS = "https://api.github.com/repos/" + REPO + "/contents/status.json?ref=status";

function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function ago(iso) {
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "agora há pouco";
  if (s < 3600) return "há " + Math.round(s / 60) + " min";
  return "há " + Math.floor(s / 3600) + " h " + Math.round((s % 3600) / 60) + " min";
}
function row(label, done, total, ok, extra) {
  var r = el("div", "row"), t = el("div", "t");
  var pct = total > 0 ? Math.min(100, Math.round(100 * done / total)) : 0;
  t.appendChild(el("span", null, label));
  t.appendChild(el("span", null, ok ? "pronto" : (extra || (pct + "%"))));
  var b = el("div", "bar"), i = el("i", ok ? "ok" : null);
  i.style.width = (ok ? 100 : pct) + "%";
  b.appendChild(i); r.appendChild(t); r.appendChild(b);
  return r;
}
var last = null;
function render(s) {
  last = s;
  document.getElementById("when").textContent = "atualizado " + ago(s.updated);
  var dot = document.getElementById("dot");
  dot.className = "dot" + (s.state === "renderizando" ? " on" : (s.state === "concluído" ? " ok" : ""));
  document.getElementById("state").textContent = s.state;
  document.getElementById("total").textContent = "Geral " + Math.round(s.overall) + "%";
  document.getElementById("now").textContent = s.current ? ("agora: " + s.current) : "";
  var rows = document.getElementById("rows"); rows.textContent = "";
  rows.appendChild(el("div", "sec", "RENDER 3D"));
  s.jobs.forEach(function (j) { if (j.kind === "BLENDER") rows.appendChild(row(j.label, j.done, j.total, j.status === "ok", j.eta)); });
  var ae = s.jobs.filter(function (j) { return j.kind === "AE"; });
  if (ae.length) {
    var okN = ae.filter(function (j) { return j.status === "ok"; }).length;
    rows.appendChild(el("div", "sec", "PÓS-PRODUÇÃO"));
    rows.appendChild(row(okN + " de " + ae.length + " versões finalizadas", okN, ae.length, okN === ae.length));
  }
  var d = s.delivery;
  if (d && d.total > 0) {
    rows.appendChild(el("div", "sec", "ENTREGA"));
    if (d.done >= d.total && d.link && /^https:\/\/(drive|docs)\.google\.com\//.test(d.link)) {
      var a = el("a", "dl", "Baixar os " + d.total + " vídeos finais");
      a.href = d.link; a.target = "_blank"; a.rel = "noopener";
      rows.appendChild(a);
    } else {
      rows.appendChild(row("Enviando para o Google Drive: " + d.done + " de " + d.total, d.done, d.total, false));
    }
  }
  if (s.img) {
    var f = document.getElementById("frame");
    var img = f.querySelector("img");
    if (!img) { f.textContent = ""; img = el("img"); img.alt = "último frame renderizado"; f.appendChild(img); }
    if (img.getAttribute("src") !== s.img) img.src = s.img;
    document.getElementById("cap").textContent = s.img_label || "";
  }
}
function tick() {
  fetch(URL_STATUS, { headers: { "Accept": "application/vnd.github.raw" }, cache: "no-store" })
    .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
    .then(render)
    .catch(function () {
      if (last) document.getElementById("when").textContent = "atualizado " + ago(last.updated) + " · reconectando…";
      else document.getElementById("state").textContent = "aguardando o primeiro status…";
    });
}
tick();
setInterval(tick, 75000);
setInterval(function () { if (last) document.getElementById("when").textContent = "atualizado " + ago(last.updated); }, 20000);
</script>
</body>
</html>
